# EXAMPLE ONLY -- do not commit real credentials. Copy to secret.yaml, fill in,
# and keep it out of git (or use a sealed-secret / external secrets operator).
#
# These are only needed if the lower tier requires HTTP auth. The value is
# appended to the hsync command line, so it appears in the pod's process list
# (acceptable for a single-tenant pod; use a network path without auth if that
# matters to you).
apiVersion: v1
kind: Secret
metadata:
  name: hsync-secrets
  namespace: hsync
  labels:
    app.kubernetes.io/name: hsync
type: Opaque
stringData:
  HSYNC_EXTRA_ARGS_SECRET: "--http-user CHANGEME --http-pass CHANGEME"
